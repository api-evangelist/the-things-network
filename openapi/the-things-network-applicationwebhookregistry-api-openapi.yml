            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            base_url:
              type: string
              description: Base URL to which the message's path is appended.
            headers:
              type: object
              additionalProperties:
                type: string
              description: HTTP headers to use.
            format:
