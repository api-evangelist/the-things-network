            template_fields:
              type: object
              additionalProperties:
                type: string
              description: The value of the fields used by the template. Maps field.id to the value.
            downlink_api_key:
              type: string
              description: 'The API key to be used for downlink queue operations.

                The field is provided for convenience reasons, and can contain API keys with additional rights (albeit this is discouraged).'
            uplink_message:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            uplink_normalized:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            join_accept:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_ack:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_nack:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_sent:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_failed:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_queued:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            downlink_queue_invalidated:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            location_solved:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            service_data:
              $ref: '#/components/schemas/v3ApplicationWebhookMessage'
            health_status:
              $ref: '#/components/schemas/v3ApplicationWebhookHealth'
            field_mask:
              type: string
            paused:
              type: boolean
              description: Set to temporarily pause forwarding uplink data to this end point and receiving downlinks from this end point.
        field_mask:
          type: string
    v3ApplicationWebhookTemplateMessage:
      type: object
      properties:
        path:
          type: string
          description: Path to append to the base URL. Can contain template fields, in RFC 6570 format.
    ApplicationWebhookHealthWebhookHealthStatusHealthy:
      type: object
    v3ApplicationWebhookTemplateField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        secret:
          type: boolean
          description: Secret decides if the field should be shown in plain-text or should stay hidden.
        default_value:
          type: string
        optional:
          type: boolean
      description: 'ApplicationWebhookTemplateField represents a custom field that needs to be filled by the user in order to use the template.

        A field can be an API key, an username or password, or any custom platform specific field (such as region).

        The fields are meant to be replaced inside the URLs and headers when the webhook is created.'
    v3ApplicationWebhookFormats:
      type: object
      properties:
        formats:
          type: object
          additionalProperties:
            type: string
          description: Format and description.
    v3ApplicationWebhookIdentifiers:
      type: object
      properties:
        application_ids:
          $ref: '#/components/schemas/v3ApplicationIdentifiers'
        webhook_id:
          type: string
    v3ApplicationWebhookMessage:
      type: object
      properties:
        path:
          type: string
          description: Path to append to the base URL.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer API key. Set Authorization: Bearer NNSXS.xxxxxxxxxx.'
