      field_mask:
        type: string
  ApplicationWebhookHealthWebhookHealthStatusHealthy:
    type: object
  v3ApplicationWebhookTemplateField:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      description:
        type: string
      secret:
        type: boolean
        description: Secret decides if the field should be shown in plain-text or should stay hidden.
      default_value:
        type: string
      optional:
        type: boolean
    description: 'ApplicationWebhookTemplateField represents a custom field that needs to be filled by the user in order to use the template.

      A field can be an API key, an username or password, or any custom platform specific field (such as region).

      The fields are meant to be replaced inside the URLs and headers when the webhook is created.'
  v3ApplicationWebhookHealth:
