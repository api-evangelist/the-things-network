        headers:
          type: object
          additionalProperties:
            type: string
          description: The HTTP headers used by the template. Both the key and the value can contain template fields.
        format:
          type: string
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/v3ApplicationWebhookTemplateField'
