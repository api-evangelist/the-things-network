        uplink_normalized:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        join_accept:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_ack:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_nack:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_sent:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_failed:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_queued:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        downlink_queue_invalidated:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        location_solved:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        service_data:
          $ref: '#/components/schemas/v3ApplicationWebhookTemplateMessage'
        field_mask:
          type: string
