  schemas:
    v3GetInfoByJoinEUIsResponse:
      type: object
      properties:
        infos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/v3GetInfoByJoinEUIResponse'
    v3GetInfoByJoinEUIRequest:
      type: object
      properties:
        join_eui:
          type: string
          format: string
          example: 70B3D57ED000ABCD
    protobufAny:
      type: object
      properties:
