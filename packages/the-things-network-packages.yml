aid: the-things-network
name: The Things Stack — Client Libraries, Binaries and Distributions
description: >-
  First-party distributions of The Things Stack (Apache-2.0) and its client tooling. The Things
  Stack itself is a Go module; the CLI (ttn-lw-cli) is distributed as Homebrew formulae, a Snap,
  and GoReleaser binaries attached to each GitHub release. The historic v2 JavaScript and Python
  application SDKs are published on npm and PyPI but have not been released since 2019 and target
  the retired v2 network — recorded here because a stale first-party SDK is itself a signal.
notes:
  - >-
    There is no first-party v3 JavaScript or Python SDK on a public registry. The v3 JS client used
    by the Console lives inside the lorawan-stack monorepo (sdk/js) and is not published to npm
    under a TheThingsNetwork-owned name. Integrators are directed at the HTTP/gRPC contract, the CLI,
    or MQTT.
  - >-
    npm "ttn-lw" is NOT first-party. Its sole registry maintainer is an unrelated account and the
    package carries no repository/homepage metadata; it is recorded with official:false so the
    absence of a first-party v3 JS SDK is not mistaken for a presence.
