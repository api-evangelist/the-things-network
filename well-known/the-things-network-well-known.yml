pointer_policy: >-
  No WellKnown and no SecurityTxt pointer is emitted for this provider. Zero paths returned a
  real document, so a pointer would assert a surface The Things Network does not serve. The
  vulnerability-disclosure surface is real but lives at
  https://www.thethingsnetwork.org/responsible-disclosure, not at /.well-known/security.txt —
  publishing an RFC 9116 security.txt pointing at that page is the single cheapest fix available
  to this provider.
