  api_version: v3
  strategy: path
  note: >-
    The API major version is carried in the path (/api/v3) and in every gRPC package name
    (ttn.lorawan.v3). Minor and patch versions of the server change behaviour additively; the
    v3 path has been stable since 2019. Protobuf field numbers are never reused, which is what
    gives v3 its backward compatibility guarantee.
