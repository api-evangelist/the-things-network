deprecation:
  policy_published: true
  mechanism: X-Warning response header
  statement: >-
    The Things Stack signals deprecations and soon-to-be-errors at runtime with an X-Warning
    response header. The API concepts documentation instructs clients to "Mind the X-Warning
    headers. The Things Stack sends responses containing this header to warn about issues that
    may become errors in the future."
  source: https://www.thethingsindustries.com/docs/api/concepts/errors/
  rfc8594_sunset_header: false
  rfc8594_note: >-
    No Sunset or Deprecation header (RFC 8594) was observed on a live response from
    https://eu1.cloud.thethings.network/api/v3. X-Warning is the provider's own mechanism and
    predates the RFC; recorded as-is rather than claimed as RFC 8594 compliance.
  deprecated_operations_in_spec: 0
  deprecated_operations_note: >-
    No operation in the 58 harvested OpenAPI documents carries deprecated: true. Deprecation is
    communicated in release notes and at runtime, not in the contract.
  major_version_history:
    - version: v2
