aid: the-things-network
url: https://raw.githubusercontent.com/api-evangelist/the-things-network/refs/heads/main/apis.yml
name: The Things Network / The Things Stack
description: The Things Network (TTN) is a free, community-operated global LoRaWAN network with over 280,000 members
  and 21,000 gateways across 153 countries. It runs on The Things Stack, the open-source (Apache-2.0) LoRaWAN Network
  Server developed and maintained by The Things Industries. The Things Stack v3 implements the full LoRaWAN Network
  Reference Model — Identity Server, Application Server, Network Server, Gateway Server, Join Server, Device Repository,
  Packet Broker Agent — and exposes a unified HTTP REST and gRPC API plus MQTT, webhooks, and Pub/Sub integrations.
  The same software powers self-hosted deployments, the free The Things Network community network, The Things Stack
  Cloud (Discovery, Standard, Plus tiers), and The Things Stack Enterprise.
